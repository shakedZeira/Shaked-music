# Robolectric 4.17 on JDK 17+ needs --add-opens jvmArgs to reach JDK internals
# (jdk.internal.access, java.io, ...). Those jvmArgs belong in app/build.gradle.kts, which is
# out of scope for this phase. On this JDK 21 toolchain, running at SDK 35+ exercises
# ApplicationSharedMemory -> SharedSecrets and aborts with
# "Failed to interact with raw FileDescriptor internals". Pinning the test SDK to 34 runs the
# same Room/SQLite code paths without that framework path.
sdk=34
