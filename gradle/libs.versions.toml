room = "2.8.5"
work = "2.12.0"
media3 = "1.11.1"
composeBom = "2026.09.00"
navigation = "2.10.2"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
datastore = "1.2.1"
coil = "3.6.3"
retrofit = "2.12.0"
okhttp = "4.12.0"
moshi = "1.15.2"
browser = "1.10.0"
coroutines = "1.10.2"
jaudiotagger = "3.0.1"
junit = "4.13.2"
coroutinesTest = "1.11.0"
robolectric = "4.17"
mockk = "1.14.11"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
