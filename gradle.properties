android.useAndroidX=true
# AGP 9 enables built-in Kotlin by default, which is incompatible with the KSP
# Gradle plugin we use for Hilt/Room codegen. Opt out and keep applying the
# org.jetbrains.kotlin.android plugin (KGP). See google/ksp#2615.
android.builtInKotlin=false
# Keep the classic android {} DSL while on AGP 9.x (paired with the opt-out above).
android.newDsl=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
